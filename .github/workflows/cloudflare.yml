name: Cloudflare
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/cloudflare-config.test.mjs scripts/cloudflare-production.test.mjs scripts/cloudflare-migrations.test.mjs scripts/cloudflare-secrets-config.test.mjs
      - run: npm run test:seed
      - run: npm run build
      - run: npm run cloudflare:check
      - name: Backend runtime, authorization and delivery regression tests
        run: >-
          npm run test -w @email-cms/backend --
          tests/unit/server-session.test.ts tests/unit/cloudflare-context.test.ts tests/unit/cloudflare-config.test.ts tests/unit/identity-transport.test.ts
          tests/unit/cloudflare-delivery.test.ts tests/unit/services/emailDeliveryPolicy.test.ts tests/unit/services/directoryDeliveryCutover.test.ts tests/unit/services/authCatalogues.test.ts tests/unit/services/retiredIdentityRpc.test.ts tests/unit/services/articleMediaRows.test.ts
          tests/unit/services/adminService.spec.ts tests/unit/publish-transaction.test.ts tests/unit/services/publishArticle.test.ts tests/unit/services/canvaEmailImport.test.ts
          tests/unit/services/fileEmailTemplateLoader.test.ts tests/unit/lib/upsert-conflict.test.ts
          tests/unit/lib/relation-select.test.ts tests/unit/auth/smz-auth.test.ts
          tests/integration/parent-readonly.test.ts tests/integration/cms-boundary.test.ts
          tests/integration/delivery-workflow.test.ts tests/unit/runtime-adapters.test.ts
          tests/unit/services/resendWebhook.test.ts tests/unit/services/newsletterMetrics.test.ts tests/unit/services/readerTracking.test.ts tests/unit/services/readerHistory.test.ts tests/integration/resend-webhook-route.test.ts
      - name: Frontend authentication and media regression tests
        run: >-
          npm run test -w @email-cms/frontend --
          tests/components/ArticleEditor.test.tsx tests/components/ArticleEditor_Storage.test.tsx tests/components/admin/ArticleForm.test.tsx tests/pages/ArticleEditorPage.test.tsx tests/hooks/usePersistentDraft.test.tsx tests/services/serverAuthService.test.ts tests/services/serverBackendClient.test.ts tests/unit/authService.test.ts tests/services/tokenManager.test.ts
          tests/services/TokenManager_Resilience.test.ts tests/services/backendClient.logout.test.ts
          tests/pages/LocalLogoutPage.test.tsx tests/pages/ParentReadonly.test.tsx
          tests/context/AuthContext_SmzSession.test.tsx tests/pages/AuthCallbackPage.test.tsx
          tests/unit/services/mediaGovernanceService.test.ts tests/unit/services/mediaService.test.ts
          tests/unit/services/trackingService.test.ts tests/unit/hooks/useAnalyticsTracking.test.tsx tests/pages/WeeklyReaderPage_Analytics.test.tsx
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Historical secret store; these resources are staging.
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ENVIRONMENT: staging
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CMS_ORIGIN: ${{ vars.CMS_ORIGIN }}
      CMS_API_ORIGIN: ${{ vars.CMS_API_ORIGIN }}
      SMZ_AUTH_ISSUER: ${{ vars.SMZ_AUTH_ISSUER }}
      CMS_IDENTITY_RETIREMENT_APPROVED: ${{ vars.CMS_IDENTITY_RETIREMENT_APPROVED }}
      CMS_IDENTITY_BACKUP_REFERENCE: ${{ vars.CMS_IDENTITY_BACKUP_REFERENCE }}
      CMS_AUTH_REGISTRATION_VERIFIED: ${{ vars.CMS_AUTH_REGISTRATION_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @email-cms/shared
      - run: npm run cloudflare:templates
      - name: Rename existing staging resources in place
        if: vars.STAGING_RESOURCE_MIGRATION == 'true'
        run: node scripts/rename-staging-resources.mjs
      - run: npm run cloudflare:configure
      - name: Validate Pages configuration
        run: npx wrangler pages functions build-env .wrangler/deploy --outfile .wrangler/deploy/pages-build-env.json
      - run: node scripts/cloudflare-check-binding.mjs
      - name: Configure persistent session and Resend secrets
        run: node scripts/cloudflare-session-secrets.mjs
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          CMS_SESSION_SECRET: ${{ secrets.CMS_SESSION_SECRET }}
          CMS_OIDC_CLIENT_SECRET: ${{ secrets.CMS_OIDC_CLIENT_SECRET }}
      - name: Initialize the explicitly approved empty CMS database
        if: vars.CMS_INITIALIZE_EMPTY_DATABASE == 'true'
        run: npm run cloudflare:schema
      - run: node scripts/cloudflare-migrate.mjs
      - run: node scripts/cloudflare-preflight.mjs
      - run: npm run cloudflare:pages:build
      - run: npx wrangler deploy --config .wrangler/deploy/cms.json
      - run: npx wrangler pages deploy --branch main
        working-directory: .wrangler/deploy
      - run: node scripts/cloudflare-smoke.mjs
